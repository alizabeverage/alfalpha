[project]
name = "alfa"
description = "Elemental abundance fitting code based on Fortran alf"
authors = [
    { name="Aliza Beverage", email="abeverage@berkeley.edu" },
]
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Development Status :: 0 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "License :: Other",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Astronomy"
]
dynamic = ["version"]
dependencies = [
    "numpy",
    "astropy",
    "scipy",
    "ipykernel>=6.16.2",
    "ipython>=7.34.0",
    "pandas>=1.1.5",
]



[tool.setuptools]
packages = ["alfa"]

[project.urls]
"Source" = "https://github.com/alizabeverage/alfalpha/tree/main"
"Bug Tracker" = "https://github.com/alizabeverage/alfalpha/issues"

[build-system]
requires = ["setuptools>=42", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "build>=1.1.1",
]

[tool.setuptools_scm]
write_to = "alfa/_version.py"
